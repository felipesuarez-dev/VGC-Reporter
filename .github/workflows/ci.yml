name: CI

# Gate que faltaba: hasta v0.3.1 el workflow de release era lo PRIMERO que
# compilaba un commit, y solo corria en tags `v*`. Un `main` roto era
# indetectable hasta el dia del release, quemando ~1h de runners del matrix.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ci-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Format
        run: cd src-tauri && cargo fmt --check

      - name: Clippy
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      # ts-rs genera un test `export_bindings_<tipo>` por cada `#[ts(export)]`
      # (50 hoy), y escribe el .ts como efecto del test. Correr la suite entera
      # los regenera de paso.
      - name: Tests (regenera bindings ts-rs)
        run: cd src-tauri && cargo test

      - name: Fail if ts-rs bindings drifted
        run: |
          if ! git diff --exit-code frontend/src/lib/types.generated.ts; then
            echo "::error::types.generated.ts está desactualizado. Corre 'cd src-tauri && cargo test' y commitea el resultado."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      # El script `build` de frontend ya es `tsc --noEmit && vite build`,
      # asi que esto cubre type-check + bundle en un paso.
      - name: Type-check + build
        run: bun run --cwd frontend build

      # Component tests, not just a type-check: `tsc && vite build` proved
      # nothing about render behaviour, which is how a crash shipped in v0.2.0
      # and only showed up after users auto-updated (Regla 1).
      - name: Component tests
        run: bun run --cwd frontend test

      - name: Locale key parity
        run: bun scripts/check-locales.ts

      - name: Version consistency
        run: bun scripts/bump-version.ts --check
