name: Regenerate latest.json

# Recovery workflow: rebuild the Tauri updater manifest from the .sig assets
# already attached to a release. The platform mapping lives in
# scripts/build_latest_json.py so it is unit-tested independently.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag whose release needs latest.json regenerated (e.g. v0.5.0.20261121-beta)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag whose release needs latest.json regenerated'
        required: true
        type: string

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download every .sig from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          mkdir -p /tmp/sigs
          gh release download "$TAG" --pattern '*.sig' --dir /tmp/sigs --skip-existing
          ls -la /tmp/sigs/

      - name: Fetch release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --json body -q .body > /tmp/release-body.md

      - name: Build latest.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/build_latest_json.py \
            --sigs-dir /tmp/sigs \
            --tag "$TAG" \
            --body-file /tmp/release-body.md \
            --repo-url "https://github.com/${{ github.repository }}" \
            --out /tmp/latest.json
          echo "--- generated latest.json ---"
          cat /tmp/latest.json

      - name: Upload latest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" /tmp/latest.json --clobber
          echo "✓ Uploaded latest.json to release $TAG"
