name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v0.2.2.20260517-beta. Required for workflow_dispatch.'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Resolve tag (push → ref_name, dispatch → input)
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Version and tag consistency
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: bun scripts/bump-version.ts --check --tag "$TAG"

      - name: Generate release body from git log
        id: notes
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          bun scripts/release-notes.ts --tag "$TAG" > /tmp/release-body.md
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            cat /tmp/release-body.md
            echo
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
          echo "----- generated body -----"
          cat /tmp/release-body.md
          echo "--------------------------"

  # Gate that was missing until v0.5.0: the release build was the first thing
  # to compile a tag, and a broken migration or frontend runtime shipped in
  # v0.4.2. Run the same checks as CI before creating the draft.
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-verify-${{ hashFiles('src-tauri/Cargo.toml') }}
      - run: cd src-tauri && cargo fmt --check
      - run: cd src-tauri && cargo clippy --all-targets -- -D warnings
      - run: cd src-tauri && cargo test
      - name: Fail if ts-rs bindings drifted
        run: |
          if ! git diff --exit-code frontend/src/lib/types.generated.ts; then
            echo "::error::types.generated.ts está desactualizado."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run --cwd frontend build
      - run: bun run --cwd frontend test
      - run: bun scripts/check-locales.ts
      - run: bun run test:scripts
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # Single-runner job that creates (or reuses) the draft release BEFORE any
  # matrix build kicks off. Eliminates the race condition where the parallel
  # `build` jobs each tried to create the same draft via tauri-action
  # and one of them silently hung after "Looking for a draft release with
  # tag ..." (observed on the v0.2.2 Windows job — log truncated, no error,
  # job marked failed). Subsequent build jobs just upload assets to the
  # release id this step produces.
  create-release:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.upsert.outputs.release_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Upsert draft release
        id: upsert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BODY: ${{ needs.prepare.outputs.body }}
        run: |
          set -e
          # Reuse the draft if one already exists for this tag (e.g. a retry
          # of a previously failed run). Match by tag; we don't care whether
          # it's draft or published — `gh release view` returns the id in
          # either case.
          existing=$(gh release view "$TAG" --json id --jq '.id' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "Reusing existing release id=$existing for tag $TAG"
          else
            # Write the multi-line body to a file so newlines survive the env
            # → CLI hop (gh release create --notes does not love embedded \n).
            printf '%s' "$BODY" > /tmp/release-body.md
            gh release create "$TAG" \
              --title "VGC Reporter $TAG" \
              --notes-file /tmp/release-body.md \
              --draft
            existing=$(gh release view "$TAG" --json id --jq '.id')
            echo "Created new draft release id=$existing for tag $TAG"
          fi
          echo "release_id=$existing" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, verify, create-release]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Only Windows is built. tauri-action's latest.json update is
      # read-modify-write, and the finalize job rebuilds it from .sig files
      # anyway. macOS and Linux are intentionally not built to keep the free
      # Actions budget focused on the targets that are actually distributed.
      matrix:
        include:
          - platform: windows-2025
            args: '--bundles msi'
            asset_name_pattern: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install dependencies (Bun)
        run: bun install --frozen-lockfile

      # Windows Authenticode signing MUST happen IN-BUILD (not after
      # tauri-action), because createUpdaterArtifacts generates the minisign
      # .sig over the final bytes — signing the binary afterwards would
      # invalidate every updater signature. We feed Tauri a `--config` overlay
      # with the imported cert thumbprint so the bundler signs the MSI and
      # THEN computes the .sig. If the cert secret is absent the build proceeds
      # UNSIGNED (no failure) — self-signed today, swap the secret for a real
      # CA cert later with no workflow change. signtool ships with the Windows
      # SDK on the runner (no node/npx → Bun-only stays intact).
      - name: Prepare Windows code signing
        id: winsign
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "::warning::WINDOWS_CERT_PFX_BASE64 not set — building UNSIGNED Windows bundles."
            "config_arg=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $sec = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          Write-Host "Imported signing cert, thumbprint $($cert.Thumbprint)"
          $cfg = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256" } } } | ConvertTo-Json -Depth 6 -Compress
          $cfgPath = Join-Path $env:RUNNER_TEMP "winsign.conf.json"
          [IO.File]::WriteAllText($cfgPath, $cfg)
          "config_arg=--config $cfgPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build & upload to draft release with tauri-action
        id: tauri
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: "bunx tauri"
          projectPath: "."
          # releaseId targets the draft created by the create-release job.
          # Skips tauri-action's own create-or-find logic which raced when
          # matrix jobs hit it at once on v0.2.1/v0.2.2.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          retryAttempts: 3
          assetNamePattern: ${{ matrix.asset_name_pattern }}
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.config_arg }}

      # Defensive belt-and-suspenders for the Windows MSI upload —
      # tauri-action v0.6 reported success for the v0.2.2 Windows job but the
      # bundles never appeared on the release (likely a sig-priority matching
      # quirk or a silently swallowed upload error). Re-upload every bundle
      # this platform produced with --clobber so the release always ends up
      # with the expected set even if tauri-action's per-job upload misses
      # something. paths from src-tauri/target/.../release/bundle/ map to:
      #   windows: msi/*.msi(.sig)
      - name: Re-upload platform bundles (defensive)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -e
          BUNDLE_DIRS=$(find src-tauri/target -type d -name bundle | head -5)
          echo "Bundle dirs found: $BUNDLE_DIRS"
          for bdir in $BUNDLE_DIRS; do
            find "$bdir" -type f \( \
              -name '*.msi' -o -name '*.msi.sig' -o -name '*.msi.zip' -o -name '*.msi.zip.sig' \
            \) -print0 | while IFS= read -r -d '' f; do
              echo "Uploading: $f"
              gh release upload "$TAG" "$f" --clobber || echo "  (upload failed, continuing)"
            done
          done

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Depends on `prepare` for outputs.tag (works on both tag push and
    # workflow_dispatch), on `verify` for the test gate, and on `build` so the
    # desktop bundles land in the draft before the APK joins them.
    needs: [prepare, verify, build]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          # On workflow_dispatch checkout would default to main HEAD; force
          # the tag's commit so the APK matches the release.
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # v3 installs the legacy `tools` package by default, which Google has
      # removed from the SDK repository: sdkmanager exits 1 with "Failed to
      # find package 'tools'" and the whole APK job dies before it builds
      # anything. v4 dropped that package and also runs on a supported Node.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK 25
        run: sdkmanager "ndk;25.2.9519653"

      - name: Set NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies (Bun)
        run: bun install --frozen-lockfile

      - name: Build Android APK
        run: bunx tauri android build --apk

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BUILD_TOOLS/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out VGC.Reporter_${{ needs.prepare.outputs.tag }}_android.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          $BUILD_TOOLS/apksigner verify --print-certs VGC.Reporter_${{ needs.prepare.outputs.tag }}_android.apk

      - name: Upload APK to GitHub release
        run: |
          for i in 1 2 3 4 5; do
            if gh release upload "${{ needs.prepare.outputs.tag }}" "VGC.Reporter_${{ needs.prepare.outputs.tag }}_android.apk" --clobber; then
              echo "APK uploaded"
              exit 0
            fi
            echo "Retry $i/5 in 30s..."
            sleep 30
          done
          echo "::error::APK upload failed after 5 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign APK for Tauri updater (minisign)
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          SIGNED_APK="VGC.Reporter_${TAG}_android.apk"
          bunx tauri signer sign -k "$PRIVATE_KEY" -p "$PRIVATE_KEY_PASSWORD" "$SIGNED_APK"
          # Upload the minisign .sig to the release alongside the apk so the
          # regenerate-latest-json recovery workflow can rebuild platforms.android
          # without re-running this job. (Without this, the .sig dies with the
          # runner and the only way to put android in latest.json is to inject
          # it inline in the step below.)
          gh release upload "$TAG" "${SIGNED_APK}.sig" --clobber

  # Rebuild latest.json from EVERY .sig now on the release (desktop bundles
  # from the matrix + the apk.sig from the android job). tauri-action's per-job
  # updater-JSON upload is unreliable in releaseId mode (v0.2.3 and v0.3.0 both
  # ended up with an android-only latest.json), so we no longer trust it: this
  # job is the single source of truth for latest.json. Reuses the proven
  # regenerate-latest-json workflow. Gated on build success so a half-failed
  # matrix never publishes a desktop-incomplete latest.json.
  finalize-latest-json:
    needs: [prepare, build, android]
    if: ${{ always() && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.android.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/regenerate-latest-json.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  # Publish the draft ONLY after latest.json is correct. Ordering
  # finalize → publish → (sync-release-notes on `published`) guarantees the
  # release the updater sees (`releases/latest`) always has a complete
  # latest.json, and sync only ever reads the good one. `--latest` makes this
  # the latest release even with a `-beta` tag; no `--prerelease`.
  publish-release:
    needs: [prepare, finalize-latest-json]
    if: ${{ always() && needs.finalize-latest-json.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        # --repo is required: this job has no checkout, so gh would otherwise
        # try to infer the repo from a local git dir and fail with
        # "fatal: not a git repository".
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
